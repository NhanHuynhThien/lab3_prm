name: token_ledger
description: TokenLedger — AI account usage, budgets and quotas. PRM393 Lab 3.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  shared_preferences: ^2.5.5
  characters: ^1.4.1
  timezone: ^0.11.2
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  google_sign_in: ^7.2.0
  cloud_firestore: ^7.0.0
  crypto: ^3.0.7
  http: ^1.6.0
  firebase_analytics: ^13.0.0
  firebase_remote_config: ^7.0.0
  firebase_crashlytics: ^6.0.0
  firebase_messaging: ^17.0.0
  firebase_storage: ^14.0.0
  pdf: ^3.13.1
  path_provider: ^2.1.6
  open_filex: ^5.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/auth/google-g.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
